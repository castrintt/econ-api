version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/infrastructure/sqlc/queries.sql"
    schema: "./internal/infrastructure/migrations" 
    gen:
      go:
        package: "repository"
        out: "./internal/infrastructure/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true #generate Querier interface